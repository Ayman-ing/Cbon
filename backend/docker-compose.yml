version: '3.8'

services:
  db:
    image: postgres:15  # Official, fast pull
    restart: always
    environment:
      POSTGRES_SERVER_NAME: db  
      POSTGRES_HOST: localhost  # HOST NAAAAME!!!! HOWA db, thank me later i save you 30 minutes
      POSTGRES_USER: cbonuser
      POSTGRES_PASSWORD: cbonpass
      POSTGRES_DB: cbon_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:  # Ensures DB is query-ready
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpass
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db_data:  # Named volume—persistent, fast